name: Dip scan (one-off)
on:
  push:
    branches: [dip-scan]
    paths: ['dip_scan.py', '.github/workflows/dip_scan.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dip-scan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas lxml requests
      - run: python dip_scan.py
      - name: Commit results
        run: |
          git config user.name "dip-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git commit -m "Dip scan results" || echo nothing
          git push origin HEAD:dip-scan
