name: RKLB Jobs Tracker

on:
  schedule:
    # Every Friday at 15:10 UTC (17:10 Israel winter time / 18:10 summer time)
    - cron: '10 15 * * 5'
  workflow_dispatch:          # manual run from the Actions tab
  push:                       # runs once right after the tracker code changes (first run = baseline)
    branches: [main]
    paths:
      - rklb_jobs/tracker.py
      - .github/workflows/rklb_jobs.yml

permissions:
  contents: write             # to save the weekly snapshot and history.csv

concurrency:
  group: rklb-jobs
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch jobs, compare to last week, email summary
        env:
          PYTHONUNBUFFERED: '1'
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python rklb_jobs/tracker.py

      - name: Save snapshot and history
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rklb_jobs/data rklb_jobs/latest_report.html
          git commit -m "rklb jobs snapshot $(date -u +%F)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "::warning::could not push the jobs snapshot"
