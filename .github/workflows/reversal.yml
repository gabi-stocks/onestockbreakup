name: Reversal Checker

on:
  schedule:
    # All times UTC (GitHub Actions cron doesn't shift for DST -- these are
    # tuned for US market hours; expect ~30-60min drift around US DST changes
    # in Mar/Nov since NYSE open is fixed in ET, not UTC).
    - cron: '45 14 * * 1-5'   # ~market open (soon after 9:30 ET)
    - cron: '0 17 * * 1-5'    # midday check
    - cron: '0 22 * * 1-5'    # after close -- full daily candle, most reliable read
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run reversal checker
        env:
          TICKERS: "ORCL"                 # e.g. "ORCL,RKLB,QCOM,TEM,GEHC"
          MIN_SIGNALS: "4"
          # Intraday runs (market-open / midday) analyze only the last COMPLETED
          # daily candle + a delayed intraday context line; the 22:00 UTC run
          # uses today's full closed candle. Manual (workflow_dispatch) runs
          # default to MORNING_MODE=true since there's no finished candle yet
          # mid-session -- switch to a full end-of-day run any time via inputs
          # or just wait for the 22:00 UTC scheduled run.
          MORNING_MODE: ${{ (github.event.schedule == '0 22 * * 1-5') && 'false' || 'true' }}
          EMAIL_ONLY_ON_TRIGGER: "true"   # only email when a BUY_TRIGGER actually fires
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python reversal_checker.py

      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ || true
          git commit -m "reversal report $(date -u +%F) $(date -u +%H:%M)" || echo "no changes"
          git push || echo "nothing to push"
