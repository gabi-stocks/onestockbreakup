name: Backtest Reversal Checklist

on:
  workflow_dispatch:        # manual run from the Actions tab only

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run backtest (baseline vs improved)
        run: python backtest.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/backtest_results.md reports/backtest_results.json || true
          git commit -m "backtest results $(date -u +%F)" || echo "no changes"
          git push || echo "nothing to push"
